name: Windows terminal compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-terminal:
    name: Windows 2022 · Node + Python runtime checks
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7"

      - name: Install uv for managed-Python integration test
        uses: astral-sh/setup-uv@v7

      - name: Provision managed Python through the Shadow installer
        shell: pwsh
        run: |
          $uv = (Get-Command uv).Source
          $env:VIRTUAL_ENV = "C:\fake-unrelated-project\.venv"
          $env:CONDA_PREFIX = "C:\fake-conda"
          @'
          import { ensurePython } from "./src/installer.js";
          const python = await ensurePython(process.env.SHADOW_TEST_UV);
          console.log(`Managed Python: ${python}`);
          if (!python.toLowerCase().includes("python")) process.exit(1);
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\shadow-ensure-python.mjs
          $env:SHADOW_TEST_UV = $uv
          node $env:RUNNER_TEMP\shadow-ensure-python.mjs
          if ($LASTEXITCODE -ne 0) { throw "Managed Python provisioning failed" }

      - name: Test Windows-aware npm CLI and installer helpers
        run: npm test

      - name: Compile Python runtime and tests
        run: python -m py_compile scripts/shadow.py scripts/smoke_test.py tests/test_shadow_cli.py tests/test_smoke_test.py

      - name: Test Python runtime on Windows
        run: python -m unittest discover -s tests -v

      - name: Validate example configurations
        shell: pwsh
        run: |
          python scripts/validate_config.py config/shadow.example.yaml
          python scripts/validate_config.py config/shadow.runtime.example.yaml

      - name: Verify npm package contents and Windows command shims
        shell: pwsh
        run: |
          $pack = npm pack --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "npm pack failed" }
          $archive = Join-Path $env:RUNNER_TEMP $pack[0].filename
          Move-Item $pack[0].filename $archive -Force
          npm install --global $archive --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Global npm installation failed" }
          shadow-gateway --version
          if ($LASTEXITCODE -ne 0) { throw "Windows shadow-gateway shim failed" }
          shadow-gateway --help
          if ($LASTEXITCODE -ne 0) { throw "Windows CLI help failed" }
