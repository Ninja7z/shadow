name: Windows terminal compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-terminal:
    name: Windows 2022 · Node ${{ matrix.node-version }} + Python
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.12.0", "22", "24"]
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7"

      - name: Verify pinned Python runtime lock and hashes
        if: matrix.node-version == '24'
        run: |
          python -m pip install --disable-pip-version-check uv
          uv venv "$env:RUNNER_TEMP/shadow-lock-check"
          uv pip install --python "$env:RUNNER_TEMP/shadow-lock-check/Scripts/python.exe" --require-hashes -r requirements.lock
          & "$env:RUNNER_TEMP/shadow-lock-check/Scripts/python.exe" -c "import litellm, yaml; print('Locked runtime imports OK')"

      - name: Provision uv and managed Python through the Shadow installer
        shell: pwsh
        run: |
          $env:VIRTUAL_ENV = "C:\fake-unrelated-project\.venv"
          $env:CONDA_PREFIX = "C:\fake-conda"
          node --input-type=module -e 'import fs from "node:fs"; import os from "node:os"; import path from "node:path"; import { ensureUv, ensurePython } from "./src/installer.js"; const installDir = fs.mkdtempSync(path.join(os.tmpdir(), "shadow-win-bootstrap-")); try { const uv = await ensureUv(installDir); console.log(`uv: ${uv.path}`); const python = await ensurePython(uv.path); console.log(`Managed Python: ${python}`); if (!fs.existsSync(python)) process.exit(1); } finally { fs.rmSync(installDir, { recursive: true, force: true }); }'
          if ($LASTEXITCODE -ne 0) { throw "Windows uv/Python provisioning failed" }

      - name: Test Windows-aware npm CLI and installer helpers
        run: npm test

      - name: Compile Python runtime and tests
        run: python -m py_compile scripts/shadow.py scripts/smoke_test.py tests/test_shadow_cli.py tests/test_smoke_test.py

      - name: Test Python runtime on Windows
        run: python -m unittest discover -s tests -v

      - name: Validate example configurations
        shell: pwsh
        run: |
          python scripts/validate_config.py config/shadow.example.yaml
          python scripts/validate_config.py config/shadow.runtime.example.yaml

      - name: Verify npm package contents and Windows command shims
        shell: pwsh
        run: |
          $pack = npm pack --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "npm pack failed" }
          $archive = Join-Path $env:RUNNER_TEMP $pack[0].filename
          Move-Item $pack[0].filename $archive -Force
          npm install --global $archive --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Global npm installation failed" }
          $commands = @("shadow-gateway.cmd", "shadow-repository.cmd", "shadow-feedback.cmd")
          foreach ($command in $commands) {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) { throw "Missing npm Windows command shim: $command" }
          }
          shadow-gateway.cmd --version
          if ($LASTEXITCODE -ne 0) { throw "Windows shadow-gateway shim failed" }
          shadow-gateway.cmd --help
          if ($LASTEXITCODE -ne 0) { throw "Windows CLI help failed" }
