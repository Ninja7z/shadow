name: Stage Shadow npm release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-stage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-stage:
    name: Test and stage npm package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Use npm with staged publishing and OIDC support
        run: npm install --global npm@latest

      - name: Install project dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check "PyYAML>=6,<7"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const expected = `v${pkg.version}`;
          if (process.env.RELEASE_TAG !== expected) {
            console.error(`Tag ${process.env.RELEASE_TAG} does not match package version ${expected}`);
            process.exit(1);
          }
          console.log(`Preparing ${pkg.name}@${pkg.version}`);
          NODE

      - name: Test npm CLI
        run: npm test

      - name: Verify hash-locked Python runtime
        run: |
          python -m pip install --disable-pip-version-check uv
          uv venv "$RUNNER_TEMP/shadow-lock-check"
          uv pip install --python "$RUNNER_TEMP/shadow-lock-check/bin/python" --require-hashes -r requirements.lock
          "$RUNNER_TEMP/shadow-lock-check/bin/python" -c "import litellm, yaml; print('Locked runtime imports OK')"

      - name: Compile Python core
        run: python -m py_compile scripts/shadow.py scripts/smoke_test.py

      - name: Test Python core
        run: python -m unittest discover -s tests -v

      - name: Submit package for npm staging
        run: npm stage publish
