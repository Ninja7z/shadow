# Zero-cloud-cost starter config. Requires local Ollama and a pulled model.
model_list:
  - model_name: shadow-local
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: http://127.0.0.1:11434
      api_key: ollama
      think: false
  - model_name: shadow-auto
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: http://127.0.0.1:11434
      api_key: ollama
      think: false
litellm_settings:
  drop_params: true
  request_timeout: 120
  set_verbose: false
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
