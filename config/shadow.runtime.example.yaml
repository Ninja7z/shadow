# Generic LiteLLM runtime example.
# Replace example model IDs, URLs and environment variable names with your own.
# Never put real credentials in this file.

model_list:
  - model_name: shadow-local
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: http://127.0.0.1:11434
      api_key: ollama
      think: false

  - model_name: shadow-auto
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: http://127.0.0.1:11434
      api_key: ollama
      think: false

  # Example OpenAI-compatible custom endpoint.
  - model_name: custom-openai-example
    litellm_params:
      model: openai/your-model-id
      api_base: https://api.example.com/v1
      api_key: os.environ/CUSTOM_OPENAI_API_KEY

  # Example Anthropic Messages-compatible custom endpoint.
  - model_name: custom-anthropic-example
    litellm_params:
      model: anthropic/your-model-id
      api_base: https://api.example.com
      api_key: os.environ/CUSTOM_ANTHROPIC_API_KEY

router_settings:
  fallbacks:
    - shadow-auto:
        - shadow-local

litellm_settings:
  drop_params: true
  request_timeout: 120
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
